name: "micro: glibc redirect probe"
on:
  push:
    branches: [ repro-arm64-musl-noble ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Install cross gcc
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Probe sscanf/strtol symbol per -std
        run: |
          printf '#include <stdio.h>\n#include <stdlib.h>\nint f(const char*s){int i=0; sscanf(s,"%%d",&i); long l=0; l=strtol(s,0,10); return i+(int)l;}\n' > t.c
          for std in "" "-std=c99" "-std=c11" "-std=gnu17" "-std=c2x" "-std=gnu2x"; do
            aarch64-linux-gnu-gcc $std -c t.c -o t.o 2>/dev/null
            printf "%-12s -> " "${std:-default}"; nm t.o | grep -E "isoc23_sscanf| U sscanf|isoc23_strtol| U strtol" | tr '\n' ' '; echo
          done
          echo "--- gcc version:"; aarch64-linux-gnu-gcc --version | head -1
          echo "--- glibc cross headers:"; dpkg -l libc6-dev-arm64-cross | tail -1
