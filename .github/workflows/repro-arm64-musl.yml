name: "micro: which .o has isoc23 refs"
on:
  push:
    branches: [ repro-arm64-musl-noble ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Install cross gcc
        run: sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build aws-lc-sys alone and inspect objects
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
          CFLAGS_aarch64_unknown_linux_musl: -U_FORTIFY_SOURCE
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
        run: |
          cd /tmp && cargo new probe-lc --bin >/dev/null 2>&1
          cd probe-lc
          echo 'aws-lc-sys = "0.45.0"' >> Cargo.toml
          cargo build --target aarch64-unknown-linux-musl 2>&1 | tail -3
          OUT=$(find target/aarch64-unknown-linux-musl -name "out" -type d | head -1)
          echo "OUT=$OUT"
          echo "=== objets contenant __isoc23:"
          for o in $(find $OUT -name "*.o" 2>/dev/null); do
            if nm -C "$o" 2>/dev/null | grep -q isoc23; then
              echo ">>> $o"
              nm "$o" | grep isoc23 | head -4
            fi
          done
          echo "=== jitter objects:"
          find $OUT -name "*jitter*" | head
