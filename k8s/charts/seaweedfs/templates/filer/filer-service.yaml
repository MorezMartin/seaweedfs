{{- if .Values.filer.enabled }}
apiVersion: v1
kind: Service
metadata:
  {{- /* Merge tolerate-unready-endpoints + custom annotations + Traefik service-level annotations */}}
  {{- $svcAnnotations := dict "service.alpha.kubernetes.io/tolerate-unready-endpoints" "true" }}
  {{- if .Values.filer.annotations }}
    {{- $_ := mergeOverwrite $svcAnnotations .Values.filer.annotations }}
  {{- end }}
  {{- if and (hasPrefix "traefik" (default "" .Values.filer.ingresses.grpc.className)) .Values.global.seaweedfs.enableSecurity }}
    {{- $_ := set $svcAnnotations "traefik.ingress.kubernetes.io/service.serversscheme" "https" }}
    {{- $_ := set $svcAnnotations "traefik.ingress.kubernetes.io/service.serverstransport" (printf "%s-%s-filer-grpc-transport@kubernetescrd" .Release.Namespace (include "seaweedfs.fullname" .)) }}
  {{- end }}
  annotations:
    {{- toYaml $svcAnnotations | nindent 4 }}
  name: {{ include "seaweedfs.componentName" (list . "filer") }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ template "seaweedfs.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: filer
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
  - name: "swfs-filer"
    port: {{ .Values.filer.port }}
    targetPort: {{ .Values.filer.port }}
    protocol: TCP
  - name: "swfs-filer-grpc"
    port: {{ .Values.filer.grpcPort }}
    targetPort: {{ .Values.filer.grpcPort }}
    protocol: TCP
  {{- if .Values.filer.s3.enabled }}
  - name: "swfs-s3"
    port: {{ .Values.filer.s3.port }}
    targetPort: {{ .Values.filer.s3.port }}
    protocol: TCP
  {{- if .Values.filer.s3.httpsPort }}
  - name: "swfs-s3-tls"
    port: {{ .Values.filer.s3.httpsPort }}
    targetPort: {{ .Values.filer.s3.httpsPort }}
    protocol: TCP
  {{- end }}
  {{- end }}
  {{- if .Values.filer.metricsPort }}
  - name: "metrics"
    port: {{ .Values.filer.metricsPort }}
    targetPort: {{ .Values.filer.metricsPort }}
    protocol: TCP
  {{- end }}
  selector:
    app.kubernetes.io/name: {{ template "seaweedfs.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: filer
{{- end }}
